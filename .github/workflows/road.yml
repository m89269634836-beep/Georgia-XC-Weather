name: Jidgeti road wetness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'road/**'
      - '.github/workflows/road.yml'
permissions:
  contents: write
concurrency:
  group: jidgeti-road-wetness
  cancel-in-progress: false
jobs:
  road:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download recent and historical Jidgeti weather
        run: python road/inspect.py
      - name: Publish road moisture diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          snapshot="$(mktemp -d)"
          cp data/road_conditions.json data/road_report.md "$snapshot/"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p data
            cp "$snapshot"/* data/
            git add data/road_conditions.json data/road_report.md
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update road wetness report'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          echo "::error::Failed to publish report"
          exit 1
