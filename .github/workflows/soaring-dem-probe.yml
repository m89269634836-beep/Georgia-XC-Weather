name: Georgia dynamic soaring DEM and model availability
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/soaring/dynamic_sites_probe.py'
      - '.github/workflows/soaring-dem-probe.yml'
permissions:
  contents: write
concurrency:
  group: soaring-dem-probe
  cancel-in-progress: false
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe DEM and wind model coverage
        run: |
          python -m py_compile scripts/soaring/dynamic_sites_probe.py
          python -u scripts/soaring/dynamic_sites_probe.py
      - name: Publish reconnaissance outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/dynamic_sites_terrain_probe.json /tmp/dynamic_sites_terrain_probe.json
          cp data/dynamic_forecast_models_probe.json /tmp/dynamic_forecast_models_probe.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dynamic_sites_terrain_probe.json data/
            cp /tmp/dynamic_forecast_models_probe.json data/
            git add data/dynamic_sites_terrain_probe.json data/dynamic_forecast_models_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish DEM exposure and regional wind model availability tests'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
