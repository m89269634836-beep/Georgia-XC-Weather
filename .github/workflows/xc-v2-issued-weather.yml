name: XC v2 archived day-ahead forecast feature extraction
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/learning/fetch_issued_forecasts.py'
      - 'data/xc_v2_multiflight_daily_labels_2024_2026.csv.gz.b64'
      - '.github/workflows/xc-v2-issued-weather.yml'
permissions:
  contents: write
concurrency:
  group: xc-v2-issued-weather
  cancel-in-progress: false
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax and fetch actual D-1 D-2 archive forecast
        run: |
          python -m py_compile scripts/learning/fetch_issued_forecasts.py
          python -u scripts/learning/fetch_issued_forecasts.py
      - name: Publish dated forecast features and completeness report
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p data
          if [[ ! -f data/xc_v2_weather_fetch_status.json ]]; then
            printf '{"error":"Job failed before weather fetch report was written"}\n' > data/xc_v2_weather_fetch_status.json
          fi
          cp data/xc_v2_weather_fetch_status.json /tmp/xc_v2_weather_fetch_status.json
          if [[ -f data/xc_v2_issued_forecast_features.csv ]]; then
            cp data/xc_v2_issued_forecast_features.csv /tmp/xc_v2_issued_forecast_features.csv
          fi
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/xc_v2_weather_fetch_status.json data/
            if [[ -f /tmp/xc_v2_issued_forecast_features.csv ]]; then
              cp /tmp/xc_v2_issued_forecast_features.csv data/
            fi
            git add data/xc_v2_weather_fetch_status.json data/xc_v2_issued_forecast_features.csv || true
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish as-issued historical D-1 D-2 weather features for v2 cross-validation'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
