name: Georgia XC weather data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2,8,14 * * *'
permissions:
  contents: write
concurrency:
  group: georgia-xc-weather
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch forecasts
        run: python scripts/fetch.py
      - name: Publish data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/latest.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update weather forecasts'
            git push
          fi
