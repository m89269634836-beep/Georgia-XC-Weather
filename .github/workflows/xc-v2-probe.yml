name: Check ECMWF day-ahead archive 2024 2025 2026
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/learning/probe_archive_availability.py'
      - '.github/workflows/xc-v2-probe.yml'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -u scripts/learning/probe_archive_availability.py
      - name: Publish coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/xc_v2_forecast_probe.json /tmp/
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/xc_v2_forecast_probe.json data/
            git add data/xc_v2_forecast_probe.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Verify ECMWF issued D-1 archive coverage by flight year'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
