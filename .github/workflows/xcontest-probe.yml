name: XContest public access probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xcontest-probe.yml'
permissions:
  contents: write
concurrency:
  group: xcontest-probe
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify access to one public flight and its KML
        run: python scripts/xcontest/probe_public.py
      - name: Publish access status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/xcontest_access_status.json /tmp/xcontest_access_status.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/xcontest_access_status.json data/xcontest_access_status.json
            git add data/xcontest_access_status.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update XContest public access status'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
