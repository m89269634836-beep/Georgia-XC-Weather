name: Scan Tbilisi open ridges for dynamic soaring reconnaissance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/soaring/scout_tbilisi_ridges.py'
      - '.github/workflows/soaring-tbilisi-scout.yml'
permissions:
  contents: write
concurrency:
  group: soaring-tbilisi-scout
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rasterio pyproj numpy
      - name: Scan Copernicus terrain and 2021 landcover
        run: python -u scripts/soaring/scout_tbilisi_ridges.py
      - name: Publish reconnaissance candidates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp data/dynamic_tbilisi_dem_scout.json /tmp/dynamic_tbilisi_dem_scout.json
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/dynamic_tbilisi_dem_scout.json data/dynamic_tbilisi_dem_scout.json
            git add data/dynamic_tbilisi_dem_scout.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Publish unverified open-ridge survey candidates near Tbilisi'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
